name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit & UI tests (Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk local-budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: local-budget-apk
          path: local-budget.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
