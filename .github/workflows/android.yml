name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # needed to publish the APK as a GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit & UI tests (Robolectric)
        run: ./gradlew --stacktrace testDebugUnitTest

      - name: Build release APK
        run: ./gradlew --stacktrace assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk local-budget.apk

      - uses: actions/upload-artifact@v4
        with:
          name: local-budget-apk
          path: local-budget.apk

      # Publish every successful push as a release, so the newest APK is always at
      # https://github.com/<owner>/<repo>/releases/latest/download/local-budget.apk
      # (easy to download straight from a phone).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: Local Budget build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          body: |
            Tap **local-budget.apk** below to download, then open it to install.
            Built from `${{ github.ref_name }}` @ ${{ github.sha }}.
          files: local-budget.apk

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: app/build/reports/tests/
